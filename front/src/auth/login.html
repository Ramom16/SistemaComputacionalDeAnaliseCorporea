<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IRONFIT - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Oswald:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <header class="navbar">
    <a href="../../index.html" class="logo">
      <div class="logo-icon">
        <span class="logo-bar"></span>
        <span class="logo-bar"></span>
        <span class="logo-bar"></span>
      </div>
      <span class="logo-text">IRONFIT</span>
    </a>
    <nav>
      <ul class="nav-links">
        <li><a href="../../index.html">Início</a></li>
        <li><a href="login.html" style="color: var(--primary-yellow);">Login</a></li>
        <li><a href="cadastro.html">Cadastrar</a></li>
      </ul>
    </nav>
  </header>

  <section class="login-hero">
    <div class="login-wrapper">
      <div class="login-container">
        <div class="login-header">
          <h2>Acesse sua<br>conta</h2>
          <p>Entre para continuar sua jornada</p>
          <div class="accent-line"></div>
        </div>

        <form id="formLogin">
          <div class="form-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="seu@email.com" required />
          </div>
          <div class="form-group">
            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Sua senha" required />
          </div>
          <button type="submit" id="btnLogin" class="btn-login">Entrar</button>
        </form>

        <p id="msg"></p>

        <div class="retorno" id="retorno">
          <div class="retorno-info">
            <p><strong>Token de Acesso:</strong></p>
            <p id="token" style="word-break: break-all; font-size: 12px; margin-top: 4px; color: var(--primary-yellow);"></p>
          </div>
          <div class="retorno-info" style="margin-top: 10px;">
            <p id="retornoUsuario"></p>
          </div>
        </div>

        <div class="link-cadastro">
          <span>Não tem conta? </span>
          <a href="cadastro.html">Cadastre-se</a>
        </div>
      </div>
    </div>
  </section>

  <script>
    const form = document.getElementById("formLogin");
    const msg = document.getElementById("msg");
    const btnLogin = document.getElementById("btnLogin");
    const retorno = document.getElementById("retorno");
    const tokenEl = document.getElementById("token");
    const retornoUsuario = document.getElementById("retornoUsuario");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      btnLogin.disabled = true;
      btnLogin.innerText = "Entrando...";
      msg.innerText = "";
      retorno.style.display = "none";

      const email = document.getElementById("email").value;
      const senha = document.getElementById("senha").value;
      const link = "http://localhost:3000";
      const path = "/auth/login";
      
      try {
        const response = await fetch(link+path, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ email, senha })
        });

        const data = await response.json();

        if (!response.ok) {
          msg.innerText = data.erro || "Erro no login";
          msg.className = "erro";
          return;
        }

        msg.innerText = data.msg;
        msg.className = "sucesso";

        // Mostrar token e dados do usuário
        tokenEl.innerText = data.token;
        retornoUsuario.innerText = `Bem-vindo, ${data.usuario.nome}!`;
        retorno.style.display = "block";

      } catch (error) {
        msg.innerText = "Erro: API não respondeu";
        msg.className = "erro";
      } finally {
        btnLogin.disabled = false;
        btnLogin.innerText = "Entrar";
      }
    });
  </script>

</body>
</html>
