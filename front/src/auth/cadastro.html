<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IRONFIT - Cadastro</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Oswald:wght@500;700;900&display=swap" rel="stylesheet">
  <!-- CSS Link -->
  <link rel="stylesheet" href="css/cadastro.css">
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <a href="../../index.html" class="logo">
      <div class="logo-icon">
        <span class="logo-bar"></span>
        <span class="logo-bar"></span>
        <span class="logo-bar"></span>
      </div>
      <span class="logo-text">IRONFIT</span>
    </a>
    <nav>
      <ul class="nav-links">
        <li><a href="../../index.html">Início</a></li>
        <li><a href="login.html">Login</a></li>
        <li><a href="cadastro.html" style="color: var(--primary-yellow);">Cadastrar</a></li>
      </ul>
    </nav>
  </header>

  <!-- Cadastro Section -->
  <section class="cadastro-hero">
    <div class="cadastro-wrapper">
      <div class="cadastro-container">
        <div class="cadastro-header">
          <h2>Crie sua<br>conta</h2>
          <p>Comece sua transformação hoje</p>
          <div class="accent-line"></div>
        </div>

        <form id="formCadastro">
          <div class="form-group">
            <label for="nome">Nome</label>
            <input type="text" id="nome" placeholder="Seu nome completo" required />
          </div>
          <div class="form-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="seu@email.com" required />
          </div>
          <div class="form-group">
            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Mínimo 6 caracteres" required />
          </div>
          <div class="form-group">
            <label for="data_nascimento">Data de Nascimento</label>
            <input type="date" id="data_nascimento" required />
          </div>
          <button type="submit" id="btnCadastro" class="btn-cadastro">Cadastrar</button>
        </form>

        <p id="msg"></p>

        <div class="link-login">
          <span>Já tem conta? </span>
          <a href="login.html">Faça login</a>
        </div>
      </div>
    </div>
  </section>

  <script>
    const form = document.getElementById("formCadastro");
    const msg = document.getElementById("msg");
    const btnCadastro = document.getElementById("btnCadastro");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      btnCadastro.disabled = true;
      btnCadastro.innerText = "Cadastrando...";
      msg.innerText = "";

      const nome = document.getElementById("nome").value;
      const email = document.getElementById("email").value;
      const senha = document.getElementById("senha").value;
      const data_nascimento = document.getElementById("data_nascimento").value;
      const link = "http://localhost:3000";
      const path = "/auth/register"

      try {
        const response = await fetch(link+path, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ nome, email, senha, data_nascimento })
        });

        const data = await response.json();

        if (!response.ok) {
          msg.innerText = data.erro || "Erro no cadastro";
          msg.className = "erro";
          return;
        }

        msg.innerText = data.msg;
        msg.className = "sucesso";

      } catch (error) {
        msg.innerText = "Erro: API não respondeu";
        msg.className = "erro";
      } finally {
        btnCadastro.disabled = false;
        btnCadastro.innerText = "Cadastrar";
      }
    });
  </script>

</body>
</html>
